<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Furniture AI</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }

        .container { max-width: 1400px; margin: 0 auto; padding: 40px 20px; }

        header { text-align: center; margin-bottom: 40px; }

        h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle { color: #888; font-size: 1.1rem; }

        .upload-section {
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(0, 217, 255, 0.3);
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .upload-section:hover, .upload-section.dragover {
            border-color: #00d9ff;
            background: rgba(0, 217, 255, 0.05);
        }

        .upload-section.has-image { padding: 20px; }

        .upload-icon { font-size: 4rem; margin-bottom: 20px; }

        .upload-text { font-size: 1.2rem; color: #aaa; }

        #preview { max-width: 100%; max-height: 400px; border-radius: 10px; display: none; }

        #file-input { display: none; }

        .btn {
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            color: #000;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 217, 255, 0.3); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-small {
            padding: 8px 20px;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .btn-selected {
            background: linear-gradient(90deg, #ff6b6b, #ff8e53);
        }

        .results { margin-top: 40px; display: none; }

        .analysis-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .analysis-card h2 {
            color: #00d9ff;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .analysis-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 10px;
        }

        .analysis-item h3 {
            color: #00ff88;
            margin-bottom: 10px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .analysis-item p { color: #fff; font-size: 1.1rem; }

        .filter-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 1px solid rgba(0, 217, 255, 0.3);
            background: transparent;
            color: #fff;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background: rgba(0, 217, 255, 0.2);
            border-color: #00d9ff;
        }

        .furniture-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .furniture-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
            border: 2px solid transparent;
        }

        .furniture-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .furniture-card.selected {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        .furniture-card h3 { color: #fff; font-size: 1.2rem; margin-bottom: 10px; }

        .furniture-card .type {
            color: #00d9ff;
            font-size: 0.9rem;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .furniture-card .details { color: #aaa; font-size: 0.95rem; margin-bottom: 15px; }

        .furniture-card .price {
            color: #00ff88;
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .match-score {
            display: inline-block;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .loader { display: none; text-align: center; padding: 40px; }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00d9ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .selected-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            display: none;
            border-top: 2px solid #00d9ff;
            z-index: 100;
        }

        .selected-panel-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .selected-count {
            font-size: 1.1rem;
            color: #00ff88;
        }

        .selected-items {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding: 10px 0;
            flex: 1;
            margin: 0 20px;
        }

        .selected-item {
            background: rgba(0, 217, 255, 0.1);
            padding: 8px 15px;
            border-radius: 10px;
            white-space: nowrap;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .selected-item .remove-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 1.2rem;
        }

        .color-dots { display: flex; gap: 8px; margin-top: 10px; }

        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .bottom-spacing { height: 100px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Room Furniture AI</h1>
            <p class="subtitle">Upload a room image, let AI analyze it, then pick your furniture</p>
        </header>

        <div class="upload-section" id="upload-section">
            <input type="file" id="file-input" accept="image/*">
            <div id="upload-placeholder">
                <div class="upload-icon">🏠</div>
                <p class="upload-text">Drop your room image here or click to browse</p>
            </div>
            <img id="preview" alt="Preview">
        </div>

        <div style="text-align: center;">
            <button class="btn" id="analyze-btn" disabled>Analyze Room</button>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>Analyzing your room...</p>
        </div>

        <div class="results" id="results">
            <div class="analysis-card">
                <h2>Room Analysis</h2>
                <div class="analysis-grid" id="analysis-grid"></div>
            </div>

            <div class="analysis-card">
                <h2>Browse Furniture</h2>
                <div class="filter-bar" id="filter-bar"></div>
                <div class="furniture-grid" id="furniture-grid"></div>
            </div>
            <div class="bottom-spacing"></div>
        </div>
    </div>

    <div class="selected-panel" id="selected-panel">
        <div class="selected-panel-content">
            <div class="selected-count" id="selected-count">0 items selected</div>
            <div class="selected-items" id="selected-items"></div>
            <button class="btn" id="save-btn">Save Selection</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
